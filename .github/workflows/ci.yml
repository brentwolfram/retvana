# CI: model checks and leak scans on every push and pull request to main (forks included), on
# manual dispatch, and before each release (called by release.yml).
#
# - No secrets are used, and pull_request_target is never used, so fork code never runs with write
#   access or with secrets. Every job behaves the same for internal, fork and Dependabot pull requests.
# - Every action is pinned to a commit SHA (version tag in the comment); Dependabot proposes updates.
# - The scanning jobs check out the commit actually pushed or the pull request head (not GitHub's
#   synthetic merge commit) into head/, with full history. They run the scanner scripts, the allowed
#   email list and .gitleaks.toml from a second checkout of the base commit in base/, so a pull request
#   cannot weaken the scanner that judges it. head/ and base/ are siblings, so neither checkout appears
#   as untracked content of the other.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  # The commit under test: the pull request head, or the pushed / dispatched / tagged commit.
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  # The commit whose scanners judge it: the pull request base, or the commit itself otherwise.
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
  GITLEAKS_VERSION: 8.30.1
  # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's gitleaks_8.30.1_checksums.txt.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install
        run: python -m pip install -e '.[dev]'
      # smoke_test.py points RETVANA_DATA_DIR at its own temporary directories, so no Data_Dir is needed.
      - name: make verify
        run: make verify PYTHON=python

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          path: head
          persist-credentials: false
          fetch-depth: 0
      - name: Check out the base commit (scanner config)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false
      - name: Install gitleaks (checksum verified)
        id: install
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          dest="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dest"
          curl -fsSL -o "$dest/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          curl -fsSL -o "$dest/checksums.txt" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          # The tarball must match both the pinned hash and the published checksums file.
          echo "${GITLEAKS_SHA256}  ${tarball}" > "$dest/pinned.txt"
          grep -qxF "${GITLEAKS_SHA256}  ${tarball}" "$dest/checksums.txt"
          (cd "$dest" && sha256sum --check --strict pinned.txt)
          tar -xzf "$dest/$tarball" -C "$dest" gitleaks
          echo "$dest" >> "$GITHUB_PATH"
      - name: gitleaks version
        run: gitleaks version
      - name: gitleaks (every commit)
        working-directory: head
        run: gitleaks git --log-opts=--all --config ../base/.gitleaks.toml --redact --no-banner .
      - name: gitleaks (working tree)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: head
        run: gitleaks dir --config ../base/.gitleaks.toml --redact --no-banner .

  commit-emails:
    name: commit-emails
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          path: head
          persist-credentials: false
          fetch-depth: 0
      - name: Check out the base commit (scanner)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Commit email check (every commit)
        working-directory: head
        run: python ../base/scripts/check_commit_emails.py --all --allowed ../base/.github/allowed-emails.txt

  forbidden-files:
    name: forbidden-files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          path: head
          persist-credentials: false
          fetch-depth: 0
      - name: Check out the base commit (scanner)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Forbidden file check (working tree)
        working-directory: head
        run: python ../base/scripts/forbidden_files.py --tree
      - name: Forbidden file check (every blob in history)
        if: ${{ !cancelled() }}
        working-directory: head
        run: python ../base/scripts/forbidden_files.py --history
