# Dependabot version updates, checked weekly. Minor and patch updates are grouped into one pull
# request per ecosystem; major updates come one per pull request. Dependabot pull requests run the
# same CI as any other pull request and need no secrets.
# pre-commit hook revs (.pre-commit-config.yaml) are bumped by the maintainer with `pre-commit autoupdate`.
version: 2
updates:
  - package-ecosystem: pip
    directory: /            # pyproject.toml
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /            # .github/workflows/
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /            # Dockerfile base image digest
    schedule:
      interval: weekly
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]
