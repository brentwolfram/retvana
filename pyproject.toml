[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "retvana"
version = "0.1.0"
description = "Retirement drawdown planner for a two-person Canadian household (2026 Ontario rules)"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "streamlit==1.66.1",
    "pandas==3.1.0",
    "numpy==2.5.4",
    "plotly==7.1.0",
    "xlsxwriter==3.3.1",
    "openpyxl==3.1.5",
    "platformdirs==4.14.2",
]

[project.optional-dependencies]
dev = [
    "pre-commit==4.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
